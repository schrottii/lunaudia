<!DOCTYPE html>
<html>
<head>
    <title>Lunaudia</title>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <link href="style/main.css" rel="stylesheet">
</head>
<body>
    <audio id="wggjAudio" type="audio/ogg" preload="auto"></audio>
    <canvas id="wggjCanvas"></canvas>

    <script>
        document.addEventListener('error', function (e) {
            if (e.target.tagName === 'IMG' || e.target.tagName === 'AUDIO') {
                console.log('Error caused by:', e.target);
                console.log('with path:', e.target.src);
            }
        }, true);
    </script>

    <script src="code/libs/wggj.js"></script>
    <script src="code/setup.js"></script>
    <script src="code/playlists.js"></script>
    <script src="code/metadata.js"></script>
    <script src="code/settings.js"></script>

    <script src="code/scenes/player.js"></script>
    <script src="code/scenes/info.js"></script>
    <script src="code/scenes/playlists.js"></script>
    <script src="code/scenes/managePaths.js"></script>
</body>
</html>
